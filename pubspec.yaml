name: que_pasa_en_tu_barrio
description: App ciudadana de reporte de problemas urbanos geolocalizados.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.6.0
  firebase_messaging: ^16.7.0
  cloud_functions: ^6.5.0
  firebase_analytics: ^12.6.0

  # Google Maps y geolocalización
  google_maps_flutter: ^2.9.0
  geolocator: ^14.1.1
  geoflutterfire_plus: ^0.0.33
  google_sign_in: ^7.2.0

  # Imágenes y multimedia
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  cached_network_image: ^4.0.4

  # Navegación y estado
  go_router: ^18.0.2
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Notificaciones locales
  flutter_local_notifications: ^22.3.1

  # UI helpers
  fl_chart: ^1.2.0
  flutter_svg: ^2.0.10+1
  shimmer: ^4.0.0
  intl: ^0.20.3
  timeago: ^3.7.0

  # Utilidades
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  logger: ^2.4.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/legal/
